<style>#vl{--paper:#fbf9f4;--paper-2:#f1eadb;--cocoa:#673f2a;--gold:#957443;--taupe:#928778;position:relative;width:100%;overflow:hidden;background:var(--paper);-webkit-text-size-adjust:100%}

#vl .bl,#vl .sp{background-image:var(--atlas);background-size:var(--aw) var(--ah);background-repeat:no-repeat}
#vl.js:not(.still) .anim{visibility:hidden}

/* ambient loops: only while revealed and on screen (class .live) */
#vl .r-pearl.in.live{animation:floaty 9s ease-in-out infinite alternate;animation-delay:calc(var(--z)*-.43s);will-change:translate}
#vl .r-string.in.live{animation:sway 11s ease-in-out infinite alternate;animation-delay:calc(var(--z)*-.61s);transform-origin:50% 30%}
#vl .r-feather.in.live{animation:breeze 8s ease-in-out infinite alternate;animation-delay:calc(var(--z)*-.5s);transform-origin:50% 100%}

#vl .r-spark.in.live{animation:twinkle 2.6s ease-in-out infinite;animation-delay:calc(var(--z)*-.3s)}

@keyframes floaty{from{translate:0 -9px}to{translate:6px 11px}}
@keyframes sway{from{rotate:-1.3deg}to{rotate:1.3deg}}
@keyframes breeze{from{rotate:-1.4deg}to{rotate:1.6deg}}
@keyframes swing{from{rotate:-1.6deg}to{rotate:1.6deg}}
@keyframes twinkle{0%,100%{scale:1;rotate:0deg;opacity:1}50%{scale:1.28;rotate:14deg;opacity:.8}}
@keyframes beat{0%,100%{scale:1}12%{scale:1.14}24%{scale:1.02}36%{scale:1.1}55%{scale:1}}
#vl .shine{translate:0 0}

@keyframes shine{0%{translate:0 0}38%,100%{translate:var(--w) 0}}

@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}

/* envelope intro */

(window.requestIdleCallback||function(f){setTimeout(f,60)})(function(){rest.forEach(load)});

 return tl;
}
var heroStart={17:0,6:.35,16:1.05,13:1.9,14:2.2,23:3.2};
var heroTL=G.timeline({paused:true});
$('.tx').forEach(function(box){
 var k=box.getAttribute('data-k'),z=+box.getAttribute('data-z'),hero=box.hasAttribute('data-hero');
 var tl=box.querySelector('.gl')?drawTL(box,hero):linesTL(box,k,hero);
 if(hero)heroTL.add(tl,heroStart[z]||0);
 else{on(box,function(){tl.play()})}
});

/* ---------- images ---------- */
var flames=$('.flame');G.set(flames,{autoAlpha:0});
function imgTween(el,role){
 var o={paused:true};
 switch(role){
  case 'collage':return G.fromTo(el,{autoAlpha:0,y:60,scale:.95},{autoAlpha:1,y:0,scale:1,duration:1.7,ease:'expo.out',paused:true});
  case 'mirror':return G.fromTo(el,{autoAlpha:0,scale:.9,rotation:-2},{autoAlpha:1,scale:1,rotation:0,duration:2,ease:'power3.out',paused:true});
  case 'envelope':return G.fromTo(el,{autoAlpha:0,y:140,rotation:-2.5,scale:.93},{autoAlpha:1,y:0,rotation:0,scale:1,duration:2,ease:'power3.out',paused:true});
  case 'shadow':return G.fromTo(el,{autoAlpha:0},{autoAlpha:1,duration:2.2,delay:.4,paused:true});
  case 'candles':return G.fromTo(el,{autoAlpha:0,y:50},{autoAlpha:1,y:0,duration:1.5,ease:'power3.out',paused:true,onStart:function(){G.to(flames,{autoAlpha:1,duration:1.4,delay:.6})}});
  case 'chand':return G.fromTo(el,{autoAlpha:0,y:-160},{autoAlpha:1,y:0,duration:2.4,ease:'elastic.out(1,.55)',paused:true});
  case 'bullet':return G.fromTo(el,{autoAlpha:0,scale:0},{autoAlpha:1,scale:1,duration:.9,ease:'back.out(3)',paused:true});
  case 'cash':return G.fromTo(el,{autoAlpha:0,scale:.6,rotation:-10},{autoAlpha:1,scale:1,rotation:0,duration:1.3,ease:'back.out(1.8)',paused:true});
  case 'divider':return G.fromTo(el,{autoAlpha:0,scaleX:.05,transformOrigin:'50% 50%'},{autoAlpha:1,scaleX:1,duration:1.8,ease:'power3.out',paused:true});
  case 'spark':case 'heart':return G.fromTo(el,{autoAlpha:0,scale:0,rotation:-30},{autoAlpha:1,scale:1,rotation:0,duration:1.1,ease:'back.out(3)',paused:true});
  case 'pearl':case 'string':case 'feather':return G.fromTo(el,{autoAlpha:0,y:70},{autoAlpha:1,y:0,duration:2.2,ease:'power3.out',paused:true});
  default:return G.fromTo(el,{autoAlpha:0},{autoAlpha:1,duration:1.2,paused:true});
 }
}
var par=[];
$('.im.anim').forEach(function(el){
 var m=el.className.match(/\br-(\w+)/),role=m?m[1]:'';
 var tw=imgTween(el,role);
 on(el,function(){ready(el,function(){el.classList.add('in');tw.play()})});
 if(role==='pearl'||role==='string'||role==='feather')par.push([el,5+((+el.style.getPropertyValue('--z')||0)%4)*2.5]);
});
$('.r-toile .kb').forEach(function(kb){par.push([kb,0])});

/* ---------- shapes ---------- */
var st=$('.stripe');
if(st.length){
 var stw=G.fromTo(st,{autoAlpha:1,scaleY:0,transformOrigin:function(i){return i%2?'50% 100%':'50% 0%'}},{scaleY:1,duration:1.6,ease:'expo.out',stagger:{each:.05,from:'center'},paused:true});
 on(st[0],function(){stw.play()});
}
var pw=$('.panel-w')[0],po=$('.panel-o')[0];
if(pw){var ptl=G.fromTo([pw,po],{autoAlpha:0,y:70},{autoAlpha:1,y:0,duration:2,ease:'power3.out',paused:true});on(pw,function(){ptl.play()})}
var bl=$('.bigL')[0];
if(bl){var bt=G.fromTo(bl,{autoAlpha:0,y:50},{autoAlpha:1,y:0,duration:2.6,ease:'power2.out',paused:true});on(bl,function(){bt.play()})}
$('.pin').forEach(function(p){
 var t=G.fromTo(p,{autoAlpha:0,y:-150},{autoAlpha:1,y:0,duration:1.5,ease:'bounce.out',paused:true,delay:.3});
 on(p,function(){p.classList.add('in');t.play()});
});
$('.btn-bg,.wbtn-bg').forEach(function(bg){
 var b=bg.getAttribute('data-b'),isW=bg.classList.contains('wbtn-bg');
 var hands=b?$('.hand[data-b="'+b+'"]'):[],ring=b?$('.ring[data-b="'+b+'"]')[0]:null;
 var tl=G.timeline({paused:true});
 tl.fromTo(bg,{autoAlpha:0,scaleX:isW?.9:.6,transformOrigin:'50% 50%'},{autoAlpha:1,scaleX:1,duration:1.2,ease:isW?'power3.out':'back.out(1.4)'},0);
 if(hands.length)tl.fromTo(hands,{autoAlpha:0,scale:0,transformOrigin:'50% 50%'},{autoAlpha:1,scale:1,duration:.7,ease:'back.out(3)'},.9).add(function(){hands.forEach(function(h){h.classList.add('in')})},1.6);
 if(ring)tl.set(ring,{autoAlpha:1},.8).add(mark(ring),.8);
 on(bg,function(){tl.play()});
});
G.to(flames,{opacity:'random(.45,1)',scale:'random(.9,1.15)',duration:'random(.16,.4)',repeat:-1,yoyo:true,ease:'sine.inOut',stagger:.09,overwrite:false});

/* ---------- go: attach reveal observers + scroll effects (after the envelope) ---------- */
var started=false;
function go(){
 if(started)return;started=true;
 if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){io.unobserve(e.target);var f=cb.get(e.target);if(f)f()}})},{rootMargin:'0px 0px -7% 0px'});
  pend.forEach(function(el){io.observe(el)});
  var amb=$('.r-pearl,.r-string,.r-feather,.r-chand,.r-spark,.r-heart,.pin,.ring,.hand,.tx.t-num');
  var io2=new IntersectionObserver(function(es){es.forEach(function(e){e.target.classList.toggle('live',e.isIntersecting)})},{rootMargin:'160px 0px'});
  amb.forEach(function(el){io2.observe(el)});
 }else{pend.forEach(function(el){var f=cb.get(el);f&&f()});$('.r-pearl,.r-string,.r-feather,.r-chand,.r-spark,.r-heart,.pin,.ring,.hand,.tx.t-num').forEach(function(e){e.classList.add('live')})}
 par.forEach(function(p){
  var el=p[0],isKb=el.classList.contains('kb');
  if(isKb)G.fromTo(el,{scale:1.14},{scale:1,ease:'none',scrollTrigger:{trigger:el.parentNode,start:'top bottom',end:'bottom top',scrub:true}});
  else G.fromTo(el,{yPercent:0},{yPercent:-p[1],ease:'none',immediateRender:false,scrollTrigger:{trigger:el,start:'top bottom',end:'bottom top',scrub:.6}});
 });
 ST.refresh();
}
var rt;window.addEventListener('resize',function(){
 clearTimeout(rt);rt=setTimeout(function(){var w=vp.clientWidth||window.innerWidth;if(Math.abs(w-lastW)>1){fit();if(started)ST.refresh()}},120);
});

/* ---------- envelope intro ---------- */
if(!intro){heroTL.play(0);go();return}
var hint=document.getElementById('hint'),env=document.getElementById('env'),flap=document.getElementById('flap'),ring=document.getElementById('ering'),
    inner=document.getElementById('envin'),card=document.getElementById('card'),cimgs=$('img',card),
    flyEl=document.getElementById('fly');
de.style.overflow='hidden';document.body.style.overflow='hidden';window.scrollTo(0,0);
G.set(env,{transformPerspective:1300,transformOrigin:'50% 60%'});
G.set(flap,{transformPerspective:1300});
G.from(hint,{autoAlpha:0,y:12,duration:1.2,delay:1.3,ease:'power2.out'});
G.fromTo(hint,{opacity:.55},{opacity:1,duration:1.6,repeat:-1,yoyo:true,ease:'sine.inOut',delay:2.6});
G.from(env,{autoAlpha:0,y:90,rotationX:18,scale:.9,duration:1.6,ease:'expo.out',delay:.15});
var idle=G.timeline({repeat:-1,yoyo:true,delay:1.6}).to(env,{y:-7,rotation:.5,duration:2.6,ease:'sine.inOut'});
var tx=G.quickTo(env,'rotationY',{duration:.9,ease:'power3.out'}),tx2=G.quickTo(env,'rotationX',{duration:.9,ease:'power3.out'});
function tilt(e){var w=window.innerWidth,h=window.innerHeight;tx((e.clientX/w-.5)*9);tx2(-(e.clientY/h-.5)*7)}
intro.addEventListener('pointermove',tilt);
var opened=false;
function open(){
 if(opened)return;opened=true;
 idle.kill();intro.removeEventListener('pointermove',tilt);
 var tl=G.timeline({onComplete:done});
 tl.to(hint,{autoAlpha:0,duration:.4},0).add(function(){ring.classList.add('go')},0)
   .to(ring,{scale:5,autoAlpha:0,duration:.9,ease:'power2.out'},0)
   .to(env,{rotationX:0,rotationY:0,rotation:0,y:0,scale:1.05,duration:1.8,ease:'power2.out'},0)
   .to(flap,{rotationX:-180,duration:1.2,ease:'power3.inOut'},.25)
   .set(flap,{zIndex:1},.85)
   .fromTo(card,{rotation:-2,transformOrigin:'50% 100%'},{rotation:0,duration:1.6,ease:'power3.out'},1.0)
   .to(card,{y:function(){return -card.offsetHeight*.5},scale:1.14,duration:1.7,ease:'power3.out'},1.0)
   .add(function(){
     var r=card.getBoundingClientRect(),w=1236*K,h=1534.3*K,l=OX,t=37*K;
     G.set(flyEl,{left:l,top:t,width:w,height:h});
     G.fromTo(flyEl,{x:r.left-l,y:r.top-t,scale:r.width/w,transformOrigin:'0 0',autoAlpha:1},{x:0,y:0,scale:1,duration:1.6,ease:'expo.inOut'});
     G.set(card,{autoAlpha:0});
   },2.75)
   .to(env,{y:'+=55vh',rotationX:14,autoAlpha:0,duration:1.2,ease:'power2.in'},2.78)
   .to(intro,{backgroundColor:'rgba(251,249,244,0)',duration:1.3,ease:'power1.inOut'},2.9)
   .add(function(){heroTL.play(0)},4.1)
   .to(intro,{autoAlpha:0,duration:.3},4.1)
   .to(flyEl,{autoAlpha:0,duration:.5,ease:'power1.out'},4.25);
}
function done(){
 de.style.overflow='';document.body.style.overflow='';
 intro.remove();flyEl.remove();
 go();
}
intro.addEventListener('click',open);
env.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
intro.addEventListener('wheel',open,{passive:true,once:true});
var ty=null;
intro.addEventListener('touchstart',function(e){ty=e.touches[0].clientY},{passive:true});
intro.addEventListener('touchmove',function(e){if(ty!==null&&ty-e.touches[0].clientY>24)open()},{passive:true});
env.focus({preventScroll:true});
})();
</script>
</body></html>
