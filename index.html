var RSVPQ_DEF={plus:true,plusName:true,diet:true,note:true};
var RSVP_ROWS=[
  {k:'plus',t:'Чи буде +1',d:'Гість вказує, скільки людей прийде разом із ним'},
  {k:'plusName',t:'Імена гостей, які будуть з ним',d:'Працює разом із питанням про +1'},
  {k:'diet',t:'Харчові побажання',d:'Алергії та дієта'},
  {k:'note',t:'Побажання або повідомлення',d:'Вільний коментар для вас'}
];
function qrBlock(link){
  var svg='';try{svg=QR.svg(link,{margin:2})}catch(e){}
  return svg?'<div class="qrbox" id="qrbox">'+svg+'</div>':'';
}
function qrDownload(link){
  try{
    var svg=QR.svg(link,{margin:4}),b=new Blob([svg],{type:'image/svg+xml'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='invitation-qr.svg';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  }catch(e){toast('Не вдалося зберегти QR-код')}
}
function shareLink(link,title){
  if(navigator.share){navigator.share({title:title||'Запрошення',text:'Запрошуємо вас на наше весілля',url:link}).catch(function(){})}
  else{copyText(link);}
}
async function viewEdit(id){
  msg('Завантаження…','');await ready;if(!needDb())return;
  var ref=db.doc('invitations/'+id),snap;
  try{snap=await ref.get()}catch(e){return msg('Не вдалося відкрити','Спробуйте оновити сторінку.')}
  if(!snap.exists)return msg('Запрошення не знайдено','Перевірте посилання або відкрийте «Моє запрошення».','<p style="margin-top:20px"><a class="btn ghost" href="#my">Моє запрошення</a></p>');
  var cur=clone(snap.data()),t=TPL[cur.tpl];
  if(cur.ownerId!==uid)return msg('Це чуже запрошення','Редагувати його може тільки той, хто його створив.','<p style="margin-top:20px"><a class="btn ghost" href="#i-'+id+'">Переглянути запрошення</a></p>');
  cur.data=Object.assign({},t.defaults,cur.data||{});cur.tr=cur.tr||{};
  cur.langs=['uk'];
  cur.sections=cur.sections&&cur.sections.length?cur.sections:baseSecs(t);
  if(cur.sections.indexOf('rsvp')<0)cur.sections.push('rsvp');
  cur.theme=cur.theme||t.theme;cur.font=cur.font||1;cur.envelope=true;
  cur.rsvpQ=Object.assign({},RSVPQ_DEF,cur.rsvpQ||{});
  var FM=fieldMap(t),ph={},step=Math.min(cur.step||0,6),tab='form',paying=false,link=baseUrl()+'#i-'+id;
  envOpen=true;palOn=true;

  var HAS_DRESS=fieldsOf(t,'dress').length>0;
  var EXTRAS=['gifts','tips','transfer','faq'].filter(function(x){return fieldsOf(t,x).length&&(x!=='gifts'||!t.secs||t.secs.indexOf('gifts')>=0)});
  var STEPS=[{k:'about',n:'Про вас',h:'Імена та фото'},{k:'wedding',n:'Весілля',h:'Дата, час і місце'},{k:'text',n:'Текст',h:'Слова запрошення'}]
    .concat(HAS_DRESS?[{k:'dress',n:'Дрескод',h:'За бажанням'}]:[])
    .concat([{k:'rsvp',n:'Відповіді',h:'Питання для гостей'},{k:'check',n:'Перевірка',h:'Огляд запрошення'},{k:'publish',n:'Публікація',h:'Посилання й QR'}]);
  if(step>=STEPS.length)step=0;
  var PVKEY={about:'head',wedding:'location',text:'save',dress:'dress',rsvp:'rsvp'};
  function isAbout(f){return f.k==='groom'||f.k==='bride'||f.type==='photo'}
  function has(s){return cur.sections.indexOf(s)>=0}

  function stState(){return {data:cur.data,tr:cur.tr,theme:cur.theme,font:cur.font,sections:cur.sections,rsvpQ:cur.rsvpQ,lang:'uk'}}
  function getVal(f){return cur.data[f.k]==null?'':cur.data[f.k]}
  function setVal(f,val){cur.data[f.k]=val}

  app.innerHTML='<div class="wztabs"><button class="btn sm on" data-tab="form">Заповнення</button><button class="btn sm ghost" data-tab="prev">Перегляд</button></div>'+
  '<div class="wz" data-tab="form"><aside class="wz-l"><div class="top"><a class="btn ghost sm" href="#my">← Назад</a><a class="btn ghost sm" href="#i-'+id+'" target="_blank" rel="noopener">Відкрити окремо</a></div><div class="phone-shell"><div class="pvscroll" id="pv"></div><div id="pvenv"></div></div><span class="pill">Так запрошення побачать гості</span></aside>'+
  '<section class="wz-r"><div class="wz-h"><div><h1>Ваше запрошення</h1><small id="stepof"></small></div><div class="linkrow"><span class="pill" id="saveSt">Збережено</span><button class="btn ghost sm" id="draftBtn">Зберегти й вийти</button></div></div><div class="stp" id="stp"></div><div class="wz-b" id="body"></div><div class="wz-f"><div class="tot">Чернетка зберігається автоматично</div><div class="go"><button class="btn ghost" id="prevBtn">← Назад</button><button class="btn" id="nextBtn">Далі →</button></div></div></section></div>';
  var wz=app.querySelector('.wz'),pv=document.getElementById('pv'),pvenv=document.getElementById('pvenv'),body=document.getElementById('body'),stpEl=document.getElementById('stp'),sst=document.getElementById('saveSt');

  function draw(){
    var s=pv.scrollTop;
    pv.innerHTML=renderInv(cur.tpl,stState(),ph,{live:false});
    pv.scrollTop=s;
    pvenv.innerHTML=!envOpen?envHTML(cur.tpl,stState(),false):'';
    tick();
  }
  function scrollPv(){
    var k=STEPS[step].k,key=PVKEY[k],top=0;
    if(key){var el=pv.querySelector('[data-sec="'+key+'"]');if(el)top=el.getBoundingClientRect().top-pv.getBoundingClientRect().top+pv.scrollTop-8}
    pv.scrollTo({top:Math.max(0,top),behavior:'smooth'});
  }
  var timer,saving=false,pend=false;
  function payload(){return {sections:cur.sections,langs:['uk'],theme:cur.theme,font:cur.font,envelope:true,rsvpQ:cur.rsvpQ,data:cur.data,tr:cur.tr,step:step}}
  async function flush(){
    if(saving){pend=true;return}saving=true;
    try{await ref.update(payload());sst.textContent='Збережено'}catch(e){sst.textContent='Не збережено'}
    saving=false;if(pend){pend=false;flush()}
  }
  function queue(){sst.textContent='Збереження…';clearTimeout(timer);timer=setTimeout(flush,700)}

  function renderStepper(){
    stpEl.innerHTML=STEPS.map(function(s,i){
      var cls=i<step?'done':(i===step?'cur':'');
      return (i?'<span class="ln'+(i<=step?' done':'')+'"></span>':'')+'<button type="button" class="'+cls+'" data-step="'+i+'"'+(i===step?' aria-current="step"':'')+'><span class="c">'+(i<step?CHECK:(i+1))+'</span><span class="l"><b>'+esc(s.n)+'</b><span>'+esc(s.h)+'</span></span></button>';
    }).join('');
    document.getElementById('stepof').textContent='Крок '+(step+1)+' з '+STEPS.length;
    document.getElementById('prevBtn').disabled=step===0;
    var nb=document.getElementById('nextBtn');nb.hidden=step===STEPS.length-1;
    var cb=stpEl.querySelector('.cur');if(cb&&cb.scrollIntoView)cb.scrollIntoView({inline:'center',block:'nearest'});
  }
  function fieldHTML(f){
    var idp='f_'+f.k,val=getVal(f);
    if(f.type==='photo'){return '<div class="fld"><span>'+esc(f.label)+'</span><div class="ph-row"><img id="th_'+f.k+'" alt="" src="'+esc((ph[f.k]&&ph[f.k].dataUrl)||t.photoDef[f.k])+'"><div class="acts"><label class="btn sm ghost" for="'+idp+'">Завантажити фото</label><input class="sr" type="file" accept="image/*" id="'+idp+'" data-photo="'+f.k+'"><button class="link" type="button" data-reset="'+f.k+'">Повернути оригінал</button></div></div></div>'}
    var lab='<label for="'+idp+'">'+esc(f.label)+'</label>';
    if(f.type==='area')return '<div class="fld">'+lab+'<textarea id="'+idp+'" data-k="'+f.k+'" rows="3" maxlength="700">'+esc(val)+'</textarea></div>';
    return '<div class="fld">'+lab+'<input id="'+idp+'" data-k="'+f.k+'" type="'+f.type+'" value="'+esc(val)+'" maxlength="140"></div>';
  }
  function fieldsHTML(fs){
    var g=null,h='';
    fs.forEach(function(f){if(f.g&&f.g!==g){h+='<h3 class="grp">'+esc(f.g)+'</h3>'}g=f.g;h+=fieldHTML(f)});
    return h;
  }
  function samples(){
    var out=[];
    Object.keys(FM).forEach(function(k){var f=FM[k];if(!f.ph||f.type==='photo')return;
      var sid=null;Object.keys(t.fields).concat(Object.keys(SH)).forEach(function(s){if(fieldsOf(t,s).indexOf(f)>=0)sid=s});
      if(sid!=='head'&&!has(sid))return;
      if(cur.data[k]===t.defaults[k])out.push(f.label+(sid&&sid!=='head'&&SEC[sid]?' ('+SEC[sid].name+')':''));
    });
    return out;
  }
  function sw(label,small,attr,on,disabled){
    return '<div class="switchcard"><div><b>'+esc(label)+'</b><small>'+esc(small)+'</small></div><button type="button" class="sw" role="switch" aria-checked="'+(!!on)+'" aria-label="'+esc(label)+'" '+attr+(disabled?' disabled':'')+'></button></div>';
  }
  function rsvpHTML(){
    var q=cur.rsvpQ,h='<h2>Відповіді гостей</h2><p class="muted">Гості відповідають прямо в запрошенні. Усі відповіді зібрані в особистому кабінеті.</p>';
    h+='<div class="switchcard fixed"><div><b>Чи будете присутні?</b><small>Так, буду / На жаль, не зможу. Це питання є завжди</small></div><span class="pill ok">завжди</span></div>';
    h+='<div class="switchcard fixed"><div><b>Імʼя гостя</b><small>Обовʼязкове поле</small></div><span class="pill ok">завжди</span></div>';
    RSVP_ROWS.forEach(function(r){
      var dis=r.k==='plusName'&&!q.plus;
      h+=sw(r.t,r.d,'data-rq="'+r.k+'"',q[r.k]&&!dis,dis);
    });
    var rf=fieldsOf(t,'rsvp');
    if(rf.length)h+='<h3 class="grp">Тексти анкети</h3>'+fieldsHTML(rf);
    return h;
  }
  function secNote(){var n=secCount(cur.sections),ex=Math.max(0,n-SEC_FREE);return '<p class="secprice">Секцій у запрошенні: <b>'+n+'</b>. '+SEC_FREE+' входять у ціну'+(ex?', ще '+ex+' × '+SEC_EXTRA+' ₴ = <b>+'+money(ex*SEC_EXTRA)+'</b>':', доплати немає')+'.</p>'}
  function priceHTML(){
    var n=secCount(cur.sections),ex=Math.max(0,n-SEC_FREE);
    return '<div class="panel pricebox"><div><span>Тариф «Самостійно»</span><b>'+money(TARIFFS[0].from)+'</b></div><div><span>Секцій: '+n+' (у ціні '+SEC_FREE+')</span><b>'+(ex?'+'+money(ex*SEC_EXTRA):'0 ₴')+'</b></div><div class="tot"><span>Разом</span><b>'+money(selfPrice(cur.sections))+'</b></div><small class="muted">Оплата після публікації: напишіть у Telegram, і ми надішлемо реквізити.</small></div>';
  }
  function publishHTML(){
    var h='',d=cur.data,names=[d.groom,d.bride].filter(Boolean).join(' та ');
    if(!cur.published){
      h+='<h2>Усе готово?</h2><p class="muted">Після публікації гості зможуть відкрити запрошення за особистим посиланням, а відповіді зʼявляться в кабінеті.</p>';
      var sm=samples();
      if(sm.length)h+='<div class="note warn" style="margin-bottom:14px">Зразковий текст ще не змінено: '+esc(sm.join(', '))+'. Опублікувати можна й так, але гості побачать його.</div>';
      h+=priceHTML();
      if(isGuest)h+='<div class="fld" style="margin:18px 0 6px"><label for="pubEmail"><b>Ваша пошта</b></label><input id="pubEmail" type="email" autocomplete="email" placeholder="you@example.com" value="'+esc(cur.email||'')+'"><small class="muted">Через неї ви входитимете в кабінет з відповідями гостей з будь-якого пристрою. Пароль не потрібен.</small></div>';
      h+='<button class="btn lg" id="payBtn" data-act="pay"'+(paying?' disabled':'')+'>'+(paying?'Публікуємо…':'Опублікувати запрошення')+'</button>';
      return h;
    }
    h+='<div class="done"><span class="eyebrow">Опубліковано</span><h2>Ваше запрошення готове 🤍</h2><p class="muted">'+esc(names)+'. Надішліть це посилання гостям або покажіть QR-код.</p>'+
      '<div class="panel pubbox"><div class="linkrow"><code>'+esc(link)+'</code></div><div class="linkrow" style="margin-top:12px"><button class="btn" data-act="copylink">Скопіювати посилання</button><button class="btn ghost" data-act="share">Поділитися</button></div></div>'+
      '<div class="panel qrpanel">'+qrBlock(link)+'<div><b>QR-код запрошення</b><p class="muted">Гості наведуть камеру телефона і потраплять у запрошення.</p><button class="btn ghost sm" data-act="qrdl">Завантажити QR</button></div></div>'+
      '<div class="panel pricebox"><div class="tot"><span>До оплати</span><b>'+money(selfPrice(cur.sections))+'</b></div><a class="btn ghost sm" target="_blank" rel="noopener" href="'+tgLink('Привіт! Я опублікувала запрошення '+link+' (тариф «Самостійно», '+secCount(cur.sections)+' секцій). Надішліть, будь ласка, реквізити для оплати '+money(selfPrice(cur.sections))+'.')+'">Отримати реквізити в Telegram</a></div>'+
      '<div class="linkrow" style="margin-top:18px"><a class="btn" href="#cab-'+id+'">Перейти в кабінет</a><a class="btn ghost" href="#i-'+id+'" target="_blank" rel="noopener">Переглянути запрошення</a></div></div>'+
      '<div class="note" style="margin-top:22px">Змінили щось у даних? Натисніть, щоб гості побачили оновлену версію. Посилання не зміниться.</div><button class="btn ghost" style="margin-top:12px" id="payBtn" data-act="pay"'+(paying?' disabled':'')+'>'+(paying?'Публікуємо…':'Опублікувати зміни')+'</button>';
    return h;
  }
  function renderBody(){
    var k=STEPS[step].k,h='',d=cur.data;
    if(k==='about'){
      h='<h2>Про вас</h2><p class="muted">Ваш шаблон уже оформлений — просто додайте свої дані.</p>'+fieldsHTML(t.fields.head.filter(isAbout));
    }else if(k==='wedding'){
      var dt=t.fields.head.filter(function(f){return f.k==='date'}),loc=fieldsOf(t,'location'),pg=fieldsOf(t,'program');
      h='<h2>Весілля</h2><p class="muted">Коли і де відбудеться свято. Зміни одразу видно в перегляді.</p>'+fieldsHTML(dt)+
        (loc.length?'<h3 class="grp">Локація</h3>'+fieldsHTML(loc):'')+(pg.length?'<h3 class="grp">Програма дня</h3><p class="muted" style="margin-top:-4px">Час початку церемонії та святкування вказуйте у програмі. Порожні події не показуються.</p>'+fieldsHTML(pg):'');
    }else if(k==='text'){
      var rest=t.fields.head.filter(function(f){return !isAbout(f)&&f.k!=='date'&&f.k!=='musicUrl'}),music=t.fields.head.filter(function(f){return f.k==='musicUrl'}),sv=fieldsOf(t,'save');
      h='<h2>Текст запрошення</h2><p class="muted">Змінюйте лише слова, оформлення лишається як у шаблоні.</p>'+fieldsHTML(rest)+(sv.length&&has('save')?'<h3 class="grp">Підпис до дати</h3>'+fieldsHTML(sv):'')+
        (music.length?'<h3 class="grp">Музика</h3>'+fieldsHTML(music):'');
      if(EXTRAS.length){
        h+='<h3 class="grp">Додатково, за бажанням</h3><p class="muted" style="margin-top:-4px">Увімкніть лише те, що потрібне. Вимкнені розділи гості не бачать.</p>'+secNote();
        EXTRAS.forEach(function(x){h+=sw(SEC[x].name,SEC[x].desc,'data-sec-toggle="'+x+'"',has(x));if(has(x))h+='<div class="subf">'+fieldsHTML(fieldsOf(t,x))+'</div>'});
      }
    }else if(k==='dress'){
      h='<h2>Дрескод</h2><p class="muted">Розділ за бажанням. Якщо вимкнений, на сайті його не буде.</p>'+sw('Додати дрескод','Побажання щодо стилю й палітра','data-sec-toggle="dress"',has('dress'))+secNote();
      if(has('dress'))h+='<div class="subf">'+fieldsHTML(fieldsOf(t,'dress'))+'</div>';
    }else if(k==='rsvp'){
      h=rsvpHTML();
    }else if(k==='check'){
      var sm=samples(),yes=function(b){return b?'так':'ні'};
      h='<h2>Перевірка</h2><p class="muted">Перегляньте запрошення так, як його побачать гості. За потреби поверніться назад і змініть дані.</p>'+
        '<div class="panel"><ul class="ck"><li><span>Пара</span><b>'+esc([d.groom,d.bride].filter(Boolean).join(' та ')||'не вказано')+'</b></li><li><span>Дата</span><b>'+esc(d.date?fmt(d.date,'uk',{day:'numeric',month:'long',year:'numeric'}):'не вказано')+'</b></li><li><span>Дрескод</span><b>'+yes(has('dress'))+'</b></li><li><span>Питання в анкеті</span><b>відповідь'+(cur.rsvpQ.plus?', +1':'')+(cur.rsvpQ.diet?', харчові побажання':'')+(cur.rsvpQ.note?', повідомлення':'')+'</b></li></ul></div>'+
        (sm.length?'<div class="note warn" style="margin:14px 0">Зразковий текст ще не змінено: '+esc(sm.join(', '))+'.</div>':'<div class="note" style="margin:14px 0">Усі основні поля заповнено.</div>')+
        '<button class="btn" data-act="preview">Переглянути запрошення</button>';
    }else{
      h=publishHTML();
    }
    body.innerHTML=h;
  }
  function renderAll(){renderStepper();renderBody();draw()}
  function go(i,noScroll){
    step=Math.max(0,Math.min(STEPS.length-1,i));renderAll();queue();
    if(!noScroll)setTimeout(scrollPv,60);
    window.scrollTo(0,0);
  }
  renderAll();setTimeout(scrollPv,120);

  /* events */
  stpEl.addEventListener('click',function(e){var b=e.target.closest('[data-step]');if(b)go(Number(b.getAttribute('data-step')))});
  document.getElementById('prevBtn').addEventListener('click',function(){go(step-1)});
  document.getElementById('nextBtn').addEventListener('click',function(){go(step+1)});
  document.getElementById('draftBtn').addEventListener('click',async function(){clearTimeout(timer);try{await ref.update(payload());toast('Чернетку збережено');location.hash='my'}catch(e){toast('Не вдалося зберегти. Спробуйте ще раз.')}});
  function showTab(n){
    tab=n;wz.setAttribute('data-tab',tab);
    app.querySelectorAll('.wztabs button').forEach(function(x){var on=x.getAttribute('data-tab')===n;x.classList.toggle('on',on);x.classList.toggle('ghost',!on)});
    if(n==='prev')setTimeout(scrollPv,60);
  }
  app.querySelectorAll('.wztabs button').forEach(function(b){b.addEventListener('click',function(){showTab(b.getAttribute('data-tab'))})});
  body.addEventListener('input',function(e){
    var k=e.target.getAttribute&&e.target.getAttribute('data-k');if(!k)return;
    setVal(FM[k],e.target.value);draw();queue();
  });
  body.addEventListener('change',async function(e){
    var k=e.target.getAttribute&&e.target.getAttribute('data-photo');if(!k||!e.target.files[0])return;
    sst.textContent='Завантаження фото…';
    try{var url=await shrink(e.target.files[0]);await db.doc('photos/'+id+'_'+k).set({inv:id,key:k,dataUrl:url,at:Date.now()});sst.textContent='Збережено'}
    catch(err){sst.textContent='Фото не завантажено';toast('Не вдалося завантажити фото. Спробуйте менший файл.')}
    e.target.value='';
  });
  body.addEventListener('click',async function(e){
    var el=e.target.closest('button');if(!el||el.disabled)return;
    var a;
    if((a=el.getAttribute('data-sec-toggle'))){
      var i=cur.sections.indexOf(a);if(i>=0)cur.sections.splice(i,1);else cur.sections.push(a);
      cur.sections.sort(function(x,y){return SEC_ORDER.indexOf(x)-SEC_ORDER.indexOf(y)});
      renderBody();draw();queue();
      setTimeout(function(){var key=PVKEY[STEPS[step].k]||a,n=pv.querySelector('[data-sec="'+a+'"]');if(n&&has(a))pv.scrollTo({top:Math.max(0,n.getBoundingClientRect().top-pv.getBoundingClientRect().top+pv.scrollTop-8),behavior:'smooth'})},60);
      return;
    }
    if((a=el.getAttribute('data-rq'))){cur.rsvpQ[a]=!cur.rsvpQ[a];renderBody();draw();queue();return}
    if((a=el.getAttribute('data-reset'))){db.doc('photos/'+id+'_'+a).delete().catch(function(){toast('Не вдалося скинути фото')});return}
    a=el.getAttribute('data-act');
    if(a==='preview'){if(window.innerWidth<=860)showTab('prev');else window.open(link,'_blank','noopener');}

function shrink(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();fr.onerror=rej;
    fr.onload=function(){
      var img=new Image();img.onerror=rej;
      img.onload=function(){
        var max=1000,q=.78;
        for(var n=0;n<8;n++){
          var r=Math.min(1,max/Math.max(img.width,img.height));
          var c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          var url=c.toDataURL('image/jpeg',q);
          if(url.length<190000)return res(url);
          q=Math.max(.35,q-.08);max-=100;
        }
        rej(new Error('too big'));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function rsvpKind(r){return r.status==='yes'?'yes':(String(r.note||'').indexOf('Повідомить пізніше')===0?'later':'no')}
function rsvpParts(r){
  var o={guests:'',diet:'',msg:[]};
  String(r.note||'').split(' · ').forEach(function(p){
    if(!p)return;
    if(p.indexOf('Гості: ')===0)o.guests=p.slice(7);
    else if(p.indexOf('Дієта: ')===0)o.diet=p.slice(7);
    else if(p!=='Повідомить пізніше')o.msg.push(p);
  });
  return o;
}
