<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inviteri — електронні запрошення від дизайнерки</title>
<meta name="description" content="Електронні запрошення на весілля та інші свята: програма, локація, анкета для гостей і кабінет з відповідями. Дизайн від Валерії, valeria.dsgn.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#f7f1ea">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Inviteri">
<meta property="og:title" content="Inviteri — електронні запрошення від дизайнерки">
<meta property="og:description" content="Одне посилання для гостей: програма, локація й анкета, а відповіді збираються в особистому кабінеті.">
<meta property="og:image" content="https://invites-1tr.pages.dev/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Forum&family=Onest:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&family=Marck+Script&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
/* Layout: storefront and wizard in a calm brown/cream UI; the invitation is a fixed-look paper object with its own theme tokens set per invitation. */
:root{
  --bg:#f7f1ea; --surface:#fffaf4; --ink:#2b1a12; --muted:#7a6558; --line:#e8dccd;
  --accent:#3d2418; --accent-ink:#f7f1ea; --ok:#3f6b4a; --warn:#8f6218; --bad:#9a3b32;
  --f-display:'Calypso','Cormorant Garamond','Times New Roman',serif;
  --f-body:'Gilroy','Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --i-ink:#3a2922; --i-paper:#ffffff; --i-dark:#3b2a24; --i-mid:#7a5846; --i-acc:#9b4a3c; --i-cream:#f6ede2;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141110; --surface:#1d1917; --ink:#f2ebe3; --muted:#b0a59b; --line:#36302b;
  --accent:#f2ebe3; --accent-ink:#141110; --ok:#8cc29a; --warn:#dbb56c; --bad:#e69b91; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141110; --surface:#1d1917; --ink:#f2ebe3; --muted:#b0a59b; --line:#36302b;
  --accent:#f2ebe3; --accent-ink:#141110; --ok:#8cc29a; --warn:#dbb56c; --bad:#e69b91; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:500;line-height:1.08;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:26px;font-weight:600;text-decoration:none;letter-spacing:.01em}
.brand i{font-style:italic;font-weight:500;color:var(--accent)}
.nav nav{display:flex;gap:18px;font-size:14px;flex-wrap:wrap}
.nav nav a{text-decoration:none;color:var(--muted)}
.nav nav a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:500;font-size:15px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{min-height:36px;padding:0 16px;font-size:14px}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:currentColor}.pill.no{color:var(--bad);border-color:currentColor}.pill.wait{color:var(--warn);border-color:currentColor}
.ic{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* shop */
.hero-s{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:36px 56px}
.hero-s h1{font-size:clamp(40px,6vw,68px);letter-spacing:-.01em}
.hero-s h1 em{color:var(--accent)}
.lead{font-size:18px;color:var(--muted);max-width:46ch;margin-top:18px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.phones{display:flex;gap:18px;justify-content:center;align-items:flex-start}
.phone{width:264px;height:520px;border:7px solid var(--ink);border-radius:36px;overflow:hidden;position:relative;background:var(--i-paper);flex:none;pointer-events:none}
.phone:nth-child(2){margin-top:48px}
.phone .sc{width:430px;transform:scale(.58);transform-origin:top left}
@media (max-width:860px){.hero-s{grid-template-columns:minmax(0,1fr)}.phones{justify-content:flex-start}}
@media (max-width:620px){.phone:nth-child(2){display:none}.phones{justify-content:center}}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.sec-h h2{font-size:clamp(30px,4vw,44px)}
.steps{list-style:none;padding:0;margin:0 0 64px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.steps li{padding:20px 20px 4px 0;display:grid;gap:6px;align-content:start}
.steps b{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.1}
.steps span{color:var(--muted);font-size:15px}
.steps .n{font-family:var(--f-display);font-style:italic;color:var(--accent);font-size:17px}
@media (max-width:860px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.steps{grid-template-columns:minmax(0,1fr)}}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-bottom:72px}
@media (max-width:760px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr);gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
@media (max-width:520px){.card{grid-template-columns:minmax(0,1fr)}}
.card .im{aspect-ratio:3/4;border-radius:999px 999px 10px 10px;overflow:hidden;background:var(--line)}
.card .im img{width:100%;height:100%;object-fit:cover;display:block}
.card .bd{display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:34px}
.card ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px;display:grid;gap:3px}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.18)}
.price{font-family:var(--f-display);font-size:34px;font-weight:600;margin-top:auto}
.price small{font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted);margin-right:6px}
.card .row{display:flex;gap:10px;flex-wrap:wrap}
footer.ft{border-top:1px solid var(--line);padding-block:28px 40px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(20,12,9,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.mb{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;max-width:760px;width:100%;display:grid;gap:12px;justify-items:center;text-align:center}
.mb h2{font-size:clamp(28px,4vw,38px)}
.mb .x{position:absolute;top:12px;right:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:22px;line-height:1;cursor:pointer}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;margin-top:8px;text-align:left}
@media (max-width:620px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.opt h3{font-size:26px}
.opt ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.opt small{color:var(--muted);font-size:13px;margin-top:auto}
.opt .btn{margin-top:6px}
/* generic panels */
.page{max-width:1120px;margin:0 auto;padding:8px 16px 64px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.note{font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.note.warn{color:var(--warn);border-color:currentColor}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.bar .t{display:flex;align-items:center;gap:12px;min-width:0}
.bar .t b{font-family:var(--f-display);font-size:22px;font-weight:600}
.demo-col{display:flex;justify-content:center;padding-block:20px}
.demo-col .inv{box-shadow:0 10px 40px rgba(0,0,0,.25)}
.fld{display:grid;gap:6px;margin-bottom:14px;min-width:0}
.fld>span,.fld>label{font-size:13px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);resize:vertical}
.fld input[type=color]{padding:3px;width:64px}
.sum{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.sum.total{font-family:var(--f-display);font-size:26px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:90;max-width:calc(100% - 32px)}
.msg{max-width:520px;margin:12vh auto;text-align:center;padding-inline:16px}
.msg h1{font-size:40px;margin-bottom:12px}
/* wizard */
.wz{display:grid;grid-template-columns:minmax(320px,40%) minmax(0,1fr);min-height:100vh}
.wz-l{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;background:var(--surface);border-right:1px solid var(--line)}
.wz-l .top{display:flex;justify-content:space-between;gap:10px;width:100%;max-width:340px}
.wz-r{display:flex;flex-direction:column;min-width:0;min-height:100vh}
.wz-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px 10px;flex-wrap:wrap}
.wz-h h1{font-size:30px}
.wz-h small{display:block;color:var(--muted);font-size:14px}
.stp{display:flex;align-items:center;overflow-x:auto;padding:12px 24px;border-bottom:1px solid var(--line);border-top:1px solid var(--line);scrollbar-width:thin}
.stp button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap;color:var(--muted);text-align:left;flex:none}
.stp .c{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:600;font-size:14px;flex:none}
.stp .c svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.stp .l b{display:block;font-weight:500;font-size:14px;color:var(--ink)}
.stp .l span{display:block;font-size:12px}
.stp .done .c,.stp .cur .c{background:var(--accent);color:var(--accent-ink)}
.stp .ln{flex:0 0 26px;height:2px;background:var(--line);margin:0 12px}
.stp .ln.done{background:var(--accent)}
.stp button:not(.cur) .l span{display:none}
.wz-b{flex:1;padding:22px 24px 28px;max-width:860px;width:100%}
.wz-b h2{font-size:34px;margin-bottom:6px}
.wz-b>p.muted{margin-bottom:18px}
.wz-f{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.wz-f .tot{font-size:14px;color:var(--muted)}
.wz-f .tot b{font-family:var(--f-display);font-size:24px;color:var(--ink);margin-left:4px}
.wz-f .go{display:flex;gap:10px}
.phone-shell{position:relative;width:320px;max-width:100%;height:min(72vh,680px);border:8px solid var(--ink);border-radius:42px;overflow:hidden;background:var(--i-paper);box-shadow:0 18px 50px rgba(0,0,0,.25)}
.phone-shell::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:84px;height:22px;border-radius:14px;background:var(--ink);z-index:40}
.pvscroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.pvscroll::-webkit-scrollbar{display:none}
.phone-shell .inv{width:390px;max-width:none;zoom:.78}
.wztabs{display:none;gap:8px;padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);border-bottom:1px solid var(--line)}
.wztabs button{flex:1}
@media (max-width:860px){
  .wz{grid-template-columns:minmax(0,1fr)}
  .wztabs{display:flex}
  .wz{min-height:0}
  .wz-l{position:static;height:auto;border-right:0;padding-block:20px;justify-content:flex-start}
  .wz[data-tab="form"] .wz-l{display:none}
  .wz[data-tab="prev"] .wz-r{display:none}
  .wz-r{min-height:calc(100vh - 60px)}
  .stp,.wz-h,.wz-b,.wz-f{padding-inline:16px}
}
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.themes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.theme{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);padding:0;cursor:pointer;text-align:center}
.theme i{display:block;height:84px}
.theme span{display:block;padding:8px 6px;font-size:14px}
.theme[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.secgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.secgrid{grid-template-columns:minmax(0,1fr)}}
.seccard{display:flex;gap:14px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px;cursor:pointer;min-width:0}
.seccard[aria-pressed="true"]{border-color:var(--accent)}
.seccard .tx{display:grid;gap:2px;min-width:0;flex:1}
.seccard b{font-weight:500}
.seccard small{color:var(--muted);font-size:13px}
.seccard .chk{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.seccard[aria-pressed="true"] .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--line);color:var(--muted)}
.tag.free{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.langgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.langgrid{grid-template-columns:minmax(0,1fr)}}
.lang{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);cursor:pointer;text-align:left}
.lang[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.lang code{font-weight:600;color:var(--muted);width:28px}
.lang .tx{display:grid;flex:1;gap:0}
.lang small{color:var(--muted)}
.switchcard{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--surface);margin-bottom:20px}
.switchcard b{display:block;font-weight:500}
.switchcard small{color:var(--muted)}
.sw{width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.grp{font-family:var(--f-body);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:500}
.fontgrid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.fontopt{border:2px solid var(--line);border-radius:12px;padding:8px 18px;background:var(--surface);cursor:pointer;font-size:24px;line-height:1.2}
.fontopt[aria-pressed="true"]{border-color:var(--accent)}
.langtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.langtabs .btn{min-height:34px;padding:0 14px;font-size:14px}
.ph-row{display:flex;gap:14px;align-items:center}
.ph-row img{width:64px;height:84px;object-fit:cover;border-radius:999px 999px 6px 6px;background:var(--line)}
.ph-row .acts{display:grid;gap:6px;justify-items:start}
.lines{margin:14px 0}
.lines .sum:first-child{border-top:0}
.langsw.low{top:calc(68px + env(safe-area-inset-top,0px))}
.check{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:14px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
/* cabinet */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0 24px}
@media (max-width:520px){.stats{grid-template-columns:minmax(0,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat b{display:block;font-family:var(--f-display);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
.linkrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linkrow code{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;user-select:all}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.list{display:grid;gap:12px}
.item{display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.item h3{font-size:26px}

/* ===================== INVITATION ===================== */
.inv{--f-scr:'Pinyon Script','Marck Script','Brush Script MT',cursive;width:100%;max-width:430px;margin:0 auto;background-color:var(--i-paper);background-image:url('img/paper-tile.jpg');background-size:600px 600px;background-repeat:repeat;background-blend-mode:multiply;color:var(--i-ink);font-family:'Cormorant Garamond','Times New Roman',serif;font-size:19px;line-height:1.38;overflow:hidden;text-align:center;position:relative}
.inv[data-font="2"]{--f-scr:'Marck Script','Brush Script MT',cursive}
.inv[data-font="3"]{--f-scr:'Bad Script','Marck Script',cursive}
.inv img{display:block;width:100%;height:100%;object-fit:cover}
.inv .scr{font-family:var(--f-scr);font-weight:400;line-height:1.1}
.inv p{margin:0 0 .9em}
.inv .eyebrow{font-size:13px;letter-spacing:.34em;text-transform:uppercase}
.inv .sec{padding:44px 30px}
.inv .small{font-size:17px;opacity:.9}
.inv .h2{font-size:44px;margin:0 0 14px}
.inv .arch{width:80%;aspect-ratio:3/4;margin:0 auto 26px;border-radius:999px 999px 0 0;overflow:hidden}
.inv .rect{width:88%;aspect-ratio:4/3;margin:0 auto 22px;border-radius:12px;overflow:hidden}
.inv .dark{background:var(--i-dark);color:var(--i-cream);padding:78px 32px 52px;border-radius:50% 50% 0 0/70px 70px 0 0;margin-top:-1px}
.inv .dark .h2{color:var(--i-cream)}
.inv .cal-m{font-family:'Cormorant Garamond',serif;font-size:30px;font-style:italic;margin-bottom:14px;text-transform:capitalize}
.inv .cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px 0;max-width:330px;margin:0 auto 22px;font-size:19px}
.inv .cal-g b,.inv .cal-g i{font-weight:400;height:34px;display:grid;place-items:center;font-style:normal}
.inv .cal-g b.on{color:var(--i-acc)}
.inv .cal-g b.heart{font-size:24px}
.inv .tl{list-style:none;margin:0;padding:0;text-align:left;display:grid;gap:18px}
.inv .tl li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:baseline;padding-bottom:16px;border-bottom:1px solid color-mix(in srgb,currentColor 25%,transparent)}
.inv .tl li.one{grid-template-columns:minmax(0,1fr)}
.inv .tl li:last-child{border-bottom:0}
.inv .tl time{font-size:36px;font-weight:500}
.inv .tl h4{margin:0 0 2px;font-size:22px;font-weight:600;font-style:italic}
.inv .tl p{margin:0;font-size:18px;opacity:.92}
.inv .dayhead{display:flex;align-items:baseline;justify-content:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.inv .dayhead .num{font-size:92px;line-height:.9;font-weight:500}
.inv .dayhead .mon{font-style:italic;font-size:24px;text-transform:lowercase}
.inv .dayhead .yr{font-size:18px;letter-spacing:.2em}
.inv .dayhead .dn{font-size:34px}
.inv .swt{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}
.inv .swt i{width:46px;height:46px;border-radius:50%;border:1px solid rgba(0,0,0,.18)}
.inv .fin{position:relative;aspect-ratio:3/4.2;border-radius:50% 50% 0 0/22% 22% 0 0;overflow:hidden;margin-top:10px}
.inv .fin::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,color-mix(in srgb,var(--i-dark) 88%,transparent),transparent 55%)}
.inv .fin .tx{position:absolute;left:0;right:0;bottom:26px;z-index:1;color:#fff4e6;padding:0 24px}
.inv .fin .tx .scr{font-size:46px}
.inv .fin .tx .names{font-size:26px;font-style:italic}
.inv .hero{position:relative;aspect-ratio:3/4.1;border-radius:0 0 50% 50%/0 0 12% 12%;overflow:hidden;color:#fff4e6}
.inv .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,color-mix(in srgb,var(--i-dark) 90%,transparent),transparent 58%)}
.inv .hero-t{position:absolute;left:0;right:0;bottom:46px;z-index:1;padding:0 20px}
.inv .hero-t .big{font-size:64px;margin:6px 0}
.inv .hero-t .names{font-size:28px;font-style:italic}
.inv .hero-t .hdate{font-size:20px;letter-spacing:.2em;margin-top:6px}
.inv.t2 .intro{padding:44px 30px 26px}
.inv.t2 .intro .scr{font-size:44px;margin-bottom:10px}
.inv.t2 .banner{background:var(--i-dark);color:var(--i-cream);border-radius:999px 999px 0 0;padding:70px 38px 30px;margin:10px 26px 0;font-size:26px;font-style:italic}
.inv.t2 .heroB{position:relative;aspect-ratio:3/4;border-radius:999px 999px 0 0;overflow:hidden;margin:0 26px}
.inv.t2 .heroB::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,color-mix(in srgb,var(--i-dark) 80%,transparent),transparent 50%)}
.inv.t2 .heroB .scr{position:absolute;left:0;right:0;bottom:22px;z-index:1;color:#fff4e6;font-size:64px}
.inv.t2 .lead2{background:var(--i-dark);color:var(--i-cream);padding:34px 32px 46px;margin:0 26px}
.inv.t2 .lead2 .bigdate{font-size:30px;font-style:italic;margin-top:10px}
.inv .addr{font-size:20px;font-weight:600}
.inv .cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:340px;margin:0 auto}
.inv .cd div{display:grid;gap:2px;padding:12px 4px;border:1px solid color-mix(in srgb,currentColor 30%,transparent);border-radius:12px}
.inv .cd b{font-size:36px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.inv .cd span{font-size:13px;letter-spacing:.06em;text-transform:lowercase}
.inv .tips{display:grid;gap:14px;text-align:left}
.inv .tip{border-left:2px solid var(--i-acc);padding-left:14px}
.inv .tip h4{margin:0 0 2px;font-size:22px;font-style:italic;font-weight:600}
.inv .tip p{margin:0;font-size:18px}
.inv .trf{display:grid;gap:4px;margin-bottom:12px}
.inv .trf .tm{font-size:44px;font-weight:500;line-height:1}
.inv .trf .rt{font-size:21px;font-style:italic}
.inv details.q{text-align:left;border:1px solid color-mix(in srgb,currentColor 30%,transparent);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.inv details.q summary{cursor:pointer;font-size:20px;font-style:italic;list-style:none;display:flex;justify-content:space-between;gap:10px}
.inv details.q summary::after{content:"+";font-style:normal}
.inv details.q[open] summary::after{content:"−"}
.inv details.q p{margin:10px 0 0;font-size:18px}
.inv .rsvp{background:var(--i-dark);color:var(--i-cream);padding:56px 30px 60px;text-align:left}
.inv .rsvp h3{font-family:var(--f-scr);font-weight:400;font-size:44px;text-align:center;margin-bottom:6px}
.inv .rsvp .sub{text-align:center;font-size:17px;opacity:.85;margin-bottom:22px}
.inv .rsvp label{display:grid;gap:4px;font-size:15px;margin-bottom:14px;font-family:var(--f-body);opacity:.95}
.inv .rsvp input[type=text],.inv .rsvp select,.inv .rsvp textarea{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid rgba(255,244,230,.4);background:rgba(255,244,230,.08);color:var(--i-cream);font:inherit;font-size:16px}
.inv .rsvp select option{color:#222}
.inv .rsvp .seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.inv .rsvp .seg label{margin:0;position:relative}
.inv .rsvp .seg span{display:grid;place-items:center;min-height:44px;border:1px solid rgba(255,244,230,.4);border-radius:10px;cursor:pointer}
.inv .rsvp .seg input{position:absolute;opacity:0;pointer-events:none}
.inv .rsvp .seg input:checked+span{background:var(--i-cream);color:var(--i-dark);border-color:var(--i-cream);font-weight:600}
.inv .rsvp .seg input:focus-visible+span{outline:2px solid var(--i-cream);outline-offset:2px}
.inv .rsvp button{width:100%;min-height:48px;border-radius:999px;border:0;background:var(--i-cream);color:var(--i-dark);font:600 16px var(--f-body);cursor:pointer}
.inv .rsvp .thx{text-align:center;font-size:24px;font-style:italic;padding:14px 0}
.inv .chatbtn{display:inline-block;margin:6px 0 4px;padding:12px 26px;border-radius:999px;background:var(--i-dark);color:var(--i-cream);text-decoration:none;font:600 15px var(--f-body)}
/* envelope */
.env{position:absolute;inset:0;z-index:30;display:grid;align-content:center;justify-items:center;gap:22px;background-color:var(--i-paper);background-image:url('img/paper-tile.jpg');background-size:600px 600px;background-repeat:repeat;background-blend-mode:multiply;color:var(--i-ink);text-align:center;cursor:pointer;transition:opacity .7s ease;font-family:'Cormorant Garamond',serif}
.env.fix{position:fixed;z-index:70}
.env.open{opacity:0;pointer-events:none}
.env-card{position:relative;width:240px;height:160px;background:var(--i-dark);border-radius:6px;box-shadow:0 16px 34px rgba(0,0,0,.28);perspective:600px}
.env-flap{position:absolute;left:0;right:0;top:0;height:104px;background:color-mix(in srgb,var(--i-dark) 82%,#fff);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .6s ease}
.env.open .env-flap{transform:rotateX(180deg)}
.env-seal{position:absolute;left:50%;top:98px;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:var(--i-acc);color:#fff;display:grid;place-items:center;font:600 14px var(--f-body);box-shadow:0 3px 8px rgba(0,0,0,.3)}
.env-names{font-family:'Pinyon Script','Marck Script',cursive;font-size:34px;line-height:1.1;padding:0 20px}
.env-hint{font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.langsw{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:75;display:flex;gap:4px;background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.12);border-radius:999px;padding:3px;backdrop-filter:blur(6px)}
.langsw button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font:500 13px var(--f-body);color:#3a2922;cursor:pointer}
.langsw button[aria-pressed="true"]{background:#3a2922;color:#fff}
/* ===== landing v2 ===== */
.lp{--gold:#a9824f;--deep:#2b1f1a;--deep-ink:#f3e8dc;background-color:var(--bg);background-image:url('img/paper-tile.jpg');background-size:600px 600px;background-blend-mode:multiply}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lp{background-image:none}}
:root[data-theme="dark"] .lp{background-image:none}
.lp .wrap{max-width:1160px;padding-inline:20px}
.lp-nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.lp-nav .in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.lp-nav nav{display:flex;gap:22px;font-size:14px}
.lp-nav nav a{white-space:nowrap}
.lp-nav nav a{text-decoration:none;color:var(--muted)}
.lp-nav nav a:hover{color:var(--ink)}
.lp-nav .r{display:flex;gap:10px;align-items:center}
@media (max-width:1040px){.lp-nav nav{display:none}}
@media (max-width:620px){.lp-nav .r .ghost{display:none}.lp-nav .brand{font-size:22px}}
.eyebrow{font:500 12px/1.2 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:var(--accent);display:inline-flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor;opacity:.7}
.lp h1,.lp h2{letter-spacing:-.012em}
.lp h2{font-size:clamp(34px,5vw,58px);font-weight:500}
.lp h1 em,.lp h2 em{font-style:italic;color:var(--accent);font-weight:500}
.lp-sec{padding-block:clamp(56px,9vw,112px)}
.lp-head{display:grid;gap:16px;max-width:760px;margin-bottom:clamp(30px,5vw,56px)}
.lp-head p{color:var(--muted);font-size:18px;max-width:56ch}
.lp-head.c{text-align:center;margin-inline:auto;justify-items:center}
/* hero */
.lp-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;padding-block:clamp(24px,5vw,56px) clamp(40px,6vw,72px)}
.lp-hero h1{font-size:clamp(46px,7vw,92px);line-height:.98;margin-top:22px}
.lp-hero .lead{font-size:19px;max-width:44ch;margin-top:24px}
.lp-hero .cta{margin-top:34px}
.btn.lg{min-height:54px;padding:0 32px;font-size:16px;letter-spacing:.01em}
.lp-proof{display:flex;gap:22px;flex-wrap:wrap;margin-top:34px;color:var(--muted);font-size:14px}
.lp-proof span{display:inline-flex;align-items:center;gap:8px}
.lp-proof svg{width:18px;height:18px;color:var(--accent)}
.lp-stage{position:relative;min-height:620px;display:flex;justify-content:center;align-items:center}
.lp-oval{position:absolute;left:50%;top:50%;width:min(470px,96%);aspect-ratio:3/4;transform:translate(-50%,-50%);border-radius:50%;border:1px solid var(--gold)}
.lp-oval::after{content:"";position:absolute;inset:12px;border:1px solid var(--line);border-radius:50%}
.lp-stage .phone{position:relative;margin:0;box-shadow:0 30px 70px rgba(60,30,20,.28)}
.lp-stage .phone.a{transform:rotate(-5deg) translateX(-18px)}
.lp-stage .phone.b{transform:rotate(4deg) translate(0,46px);margin-left:-64px}
.lp-chip{position:absolute;z-index:3;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 16px 9px 10px;font-size:13px;box-shadow:0 12px 30px rgba(60,30,20,.16);white-space:nowrap}
.lp-chip i{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-size:14px}
.lp-chip b{font-weight:500}
.lp-chip.c1{left:0;top:18%}.lp-chip.c2{right:0;bottom:16%}
@media (max-width:980px){.lp-hero{grid-template-columns:minmax(0,1fr)}.lp-stage{min-height:600px}}
@media (max-width:620px){.lp-stage .phone.b{display:none}.lp-stage .phone.a{display:block;transform:none}.lp-chip.c1{left:-4px;top:6%}.lp-chip.c2{right:-4px;bottom:6%}.lp-stage{min-height:580px}}
/* marquee */
.lp-strip{border-block:1px solid var(--line);background:color-mix(in srgb,var(--surface) 60%,transparent);overflow:hidden}
.lp-strip .row{display:flex;gap:44px;padding-block:18px;white-space:nowrap;width:max-content;animation:lpm 38s linear infinite;font:italic 500 24px/1 var(--f-display);color:var(--muted)}
.lp-strip .row span::after{content:"✦";font-style:normal;font-size:12px;margin-left:44px;color:var(--gold)}
@keyframes lpm{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.lp-strip .row{animation:none}}
/* how */
.lp-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;list-style:none;padding:0;margin:0}
.lp-steps li{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:999px 999px 22px 22px;padding:58px 22px 28px;display:grid;gap:10px;justify-items:center;text-align:center;align-content:start}
.lp-steps li::before{content:"";position:absolute;inset:6px;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:inherit;pointer-events:none}
.lp-steps .n{font:italic 500 64px/1 var(--f-display);color:var(--accent)}
.lp-steps b{font:600 26px/1.1 var(--f-display)}
.lp-steps span{color:var(--muted);font-size:15px}
@media (max-width:980px){.lp-steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.lp-steps{grid-template-columns:minmax(0,1fr)}}
/* templates */
.lp-tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px}
@media (max-width:860px){.lp-tpls{grid-template-columns:minmax(0,1fr)}}
.lp-tpl{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1fr);gap:22px}
@media (max-width:520px){.lp-tpl{grid-template-columns:minmax(0,1fr)}}
.lp-tpl .im{position:relative;border-radius:999px 999px 14px 14px;overflow:hidden;aspect-ratio:3/4.3;background:var(--line)}
.lp-tpl .im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s ease}
.lp-tpl:hover .im img{transform:scale(1.04)}
.lp-tpl .bd{display:flex;flex-direction:column;gap:12px;min-width:0;padding-block:10px 4px}
.lp-tpl h3{font-size:44px;font-weight:500}
.lp-tpl ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;color:var(--muted);font-size:15px}
.lp-tpl li{display:flex;gap:10px;align-items:flex-start}
.lp-tpl li::before{content:"";width:6px;height:6px;margin-top:9px;border-radius:50%;background:var(--gold);flex:none}
.lp-tpl .price{margin-top:auto;font-size:40px}
.lp-add{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:34px;border:1px solid var(--line);border-radius:20px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.lp-add div{padding:20px 24px;display:grid;gap:4px}
.lp-add div+div{border-left:1px solid var(--line)}
.lp-add b{font:600 22px/1.15 var(--f-display)}
.lp-add span{color:var(--muted);font-size:14px}
.lp-add em{font:italic 500 24px/1 var(--f-display);color:var(--accent)}
@media (max-width:700px){.lp-add{grid-template-columns:minmax(0,1fr)}.lp-add div+div{border-left:0;border-top:1px solid var(--line)}}
/* dark band + builder */
.lp-dark{background:var(--deep);color:var(--deep-ink);background-image:radial-gradient(900px 500px at 85% 0,rgba(169,130,79,.18),transparent 60%)}
.lp-dark .eyebrow{color:#d9b98c}
.lp-dark h2 em{color:#e0b995}
.lp-dark .lp-head p{color:#cdbbab}
.lp-b{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center}
@media (max-width:940px){.lp-b{grid-template-columns:minmax(0,1fr)}}
.lp-win{background:var(--surface);color:var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08)}
.lp-win .top{display:flex;gap:7px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,var(--surface))}
.lp-win .top i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.lp-win .top small{margin-left:10px;color:var(--muted);font-size:12px;letter-spacing:.04em}
.lp-win .bd{padding:22px;display:grid;gap:22px}
.lp-stp{display:flex;gap:6px;flex-wrap:wrap}
.lp-stp span{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.lp-stp span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lp-b h4{margin:0 0 10px;font:600 13px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lp-tabs{display:flex;gap:8px;flex-wrap:wrap}
.lp-tabs button{min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px}
.lp-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lp-sw{display:flex;gap:10px;flex-wrap:wrap}
.lp-sw button{width:38px;height:38px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.lp-sw button[aria-pressed="true"]{border-color:var(--surface);box-shadow:0 0 0 2px var(--accent)}
.lp-tg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.lp-tg{grid-template-columns:minmax(0,1fr)}}
.lp-tg button{display:flex;align-items:center;gap:10px;text-align:left;min-height:46px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:transparent;cursor:pointer;font-size:14px}
.lp-tg button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.lp-tg .ic{width:20px;height:20px}
.lp-tg .tg{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.lp-tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:14px}
.lp-tot b{font:600 30px/1 var(--f-display);color:var(--ink)}
.lp-pw{display:flex;justify-content:center}
.lp-shell{position:relative;width:340px;max-width:100%;height:600px;border:8px solid #120c0a;border-radius:44px;overflow:hidden;background:var(--i-paper,#fff);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lp-shell::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:84px;height:22px;border-radius:14px;background:#120c0a;z-index:5}
.lp-shell .sc{height:100%;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
.lp-shell .sc::-webkit-scrollbar{display:none}
.lp-shell .z{zoom:.74}
.lp-hint{text-align:center;color:#bfae9f;font-size:13px;margin-top:14px}
/* named */
.lp-n{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,5vw,70px);align-items:center}
@media (max-width:940px){.lp-n{grid-template-columns:minmax(0,1fr)}}
.lp-list{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:14px}
.lp-list li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;color:var(--muted)}
.lp-list li b{color:var(--ink);font-weight:500}
.lp-list .k{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--accent)}
.lp-list .k svg{width:16px;height:16px}
.lp-soon{font:500 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--gold);color:var(--accent);border-radius:999px;padding:5px 10px}
.lp-nv{position:relative;min-height:520px;padding-bottom:60px;display:grid;place-items:center}
.lp-guest{position:relative;z-index:2;width:min(100%,520px);background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 26px 60px rgba(60,30,20,.16);overflow:hidden}
.lp-guest .h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.lp-guest .h b{font:600 22px/1 var(--f-display)}
.lp-gr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.lp-gr:last-child{border-bottom:0}
.lp-gr b{font-weight:500}
.lp-gr code{grid-column:1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-gr .pill{grid-row:1/3;grid-column:2}
.lp-env{position:absolute;z-index:3;right:-6px;bottom:-70px;width:min(250px,56%);background:#fbf5ea;color:#3a2922;border:1px solid var(--line);border-radius:140px 140px 16px 16px;padding:34px 18px 20px;text-align:center;box-shadow:0 22px 50px rgba(60,30,20,.22);transform:rotate(3deg)}
.lp-env small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8a6a5a}
.lp-env .sc2{font:400 40px/1.05 'Pinyon Script','Marck Script',cursive;margin-block:6px 8px}
.lp-env p{font:italic 500 16px/1.3 var(--f-display)}
.lp-packs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:clamp(36px,5vw,64px)}
@media (max-width:860px){.lp-packs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lp-pack{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:6px;text-align:center}
.lp-pack b{font:600 38px/1 var(--f-display)}
.lp-pack span{color:var(--muted);font-size:14px}
.lp-pack em{font:italic 500 26px/1.1 var(--f-display);color:var(--accent);margin-top:6px}
.lp-pack.pop{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
/* cabinet */
.lp-c{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(28px,5vw,70px);align-items:center}
@media (max-width:940px){.lp-c{grid-template-columns:minmax(0,1fr)}.lp-c .txt{order:-1}}
.lp-st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.lp-st{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lp-st div{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lp-st b{display:block;font:600 34px/1 var(--f-display)}
.lp-st span{font-size:12px;color:var(--muted)}
.lp-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.lp-bar i{display:block;height:100%}
.lp-tb{display:grid;font-size:14px}
.lp-tb .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 2px;border-top:1px solid var(--line)}
.lp-tb .r span{color:var(--muted);font-size:13px}
.lp-lnk{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lp-lnk code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px}
/* faq */
.lp-faq{max-width:820px;margin-inline:auto;border-top:1px solid var(--line)}
.lp-faq details{border-bottom:1px solid var(--line)}
.lp-faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 2px;font:500 26px/1.15 var(--f-display)}
.lp-faq summary::-webkit-details-marker{display:none}
.lp-faq summary::after{content:"+";font:300 30px/1 var(--f-body);color:var(--accent);flex:none;transition:transform .25s}
.lp-faq details[open] summary::after{transform:rotate(45deg)}
.lp-faq details p{padding:0 40px 24px 2px;color:var(--muted);font-size:16px;max-width:64ch}
/* final */
.lp-fin{text-align:center;padding-block:clamp(64px,10vw,130px)}
.lp-fin h2{font-size:clamp(40px,7vw,84px);line-height:1;max-width:14ch;margin:20px auto 0}
.lp-fin p{color:#cdbbab;margin:22px auto 34px;max-width:46ch;font-size:18px}
.lp-fin .btn{background:#f3e8dc;color:#2b1f1a;border-color:#f3e8dc}
.lp-fin .btn.ghost{background:transparent;color:#f3e8dc;border-color:rgba(243,232,220,.4)}
.lp-fin .cta{justify-content:center}
.lp-ft{background:var(--deep);color:#bfae9f}
.lp-ft .ft{border-top:1px solid rgba(255,255,255,.1);color:#bfae9f}
.lp-ft a{color:#e8d8c6}

/* ===== v3: categories, plans, individual order, motion, music ===== */
.lp-cats{display:flex;gap:8px;flex-wrap:wrap;margin:-14px 0 30px}
.lp-cats button{min-height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font:500 15px var(--f-body);transition:background .25s,color .25s,border-color .25s}
.lp-cats button:hover{border-color:var(--accent)}
.lp-cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lp-tpl.soon{grid-template-columns:minmax(0,1fr);align-content:center;justify-items:center;text-align:center;min-height:340px;border-style:dashed;background:transparent}
.lp-tpl.soon h3{font-size:34px}
.lp-tpl .tgl{display:inline-flex;align-self:flex-start;font:500 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--gold);color:var(--accent);border-radius:999px;padding:6px 10px}
.lp-plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:stretch}
@media (max-width:940px){.lp-plans{grid-template-columns:minmax(0,1fr);max-width:520px;margin-inline:auto}}
.lp-plan{position:relative;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:32px 26px 26px;transition:transform .35s,box-shadow .35s}
.lp-plan:hover{transform:translateY(-6px);box-shadow:0 26px 54px rgba(60,30,20,.14)}
.lp-plan.pop{background:var(--deep);color:var(--deep-ink);border-color:var(--deep);box-shadow:0 30px 60px rgba(43,31,26,.28)}
.lp-plan .tag{position:absolute;top:-13px;left:26px;font:500 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;background:var(--gold);color:#fff;border-radius:999px;padding:7px 12px}
.lp-plan h3{font:500 36px/1 var(--f-display)}
.lp-plan .sub{color:var(--muted);font-size:15px}
@media (min-width:941px){.lp-plan .sub{min-height:70px}}
.lp-plan.pop .sub{color:#cdbbab}
.lp-plan .pr{font:500 48px/1 var(--f-display)}
.lp-plan .pr small{font:400 14px var(--f-body);color:var(--muted);margin-right:6px}
.lp-plan.pop .pr small{color:#cdbbab}
.lp-plan ul{list-style:none;padding:0;margin:6px 0 14px;display:grid;gap:11px;font-size:15px}
.lp-plan li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px}
.lp-plan li svg{width:18px;height:18px;color:var(--accent);margin-top:2px}
.lp-plan.pop li svg{color:#e0b995}
.lp-plan .btn{margin-top:auto}
.lp-plan.pop .btn{background:#f3e8dc;color:#2b1f1a;border-color:#f3e8dc}
.lp-plan .free{align-self:flex-start;font:500 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--gold);color:var(--accent);border-radius:999px;padding:6px 10px}
.lp-pnote{text-align:center;color:var(--muted);font-size:14px;margin-top:26px}
.lp-cu{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:center}
@media (max-width:940px){.lp-cu{grid-template-columns:minmax(0,1fr)}}
.lp-cu p.lead2{color:var(--muted);font-size:18px;max-width:46ch;margin-top:20px}
.lp-cs{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.lp-cs li{display:grid;grid-template-columns:58px minmax(0,1fr);gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px}
.lp-cs .n{font:italic 500 46px/1 var(--f-display);color:var(--accent)}
.lp-cs b{display:block;font:600 22px/1.15 var(--f-display);margin-bottom:4px}
.lp-cs .t{color:var(--muted);font-size:15px}
.lp-msg{margin-top:26px;border:1px dashed var(--gold);border-radius:18px;padding:16px 18px;display:grid;gap:12px}
.lp-msg pre{margin:0;white-space:pre-wrap;font:14px/1.55 var(--f-body);color:var(--muted)}
.lp-msg .row{display:flex;gap:10px;flex-wrap:wrap}
.showf{display:block;width:100%;height:calc(100vh - 62px);height:calc(100dvh - 62px);border:0;background:#fbf9f4}
.mus{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:60;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(43,31,26,.82);color:#f3e8dc;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mus svg{width:22px;height:22px}
.mus.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(243,232,220,.7);animation:musP 1.8s ease-out infinite}
@keyframes musP{from{transform:scale(.85);opacity:.9}to{transform:scale(1.35);opacity:0}}
.inv .rsvp [hidden]{display:none!important}
.inv .rsvp .chk{display:flex;align-items:center;gap:10px;cursor:pointer}
.inv .rsvp .chk input{width:20px;height:20px;accent-color:var(--i-cream);flex:none}
.inv .rsvp input[type=text]::placeholder,.inv .rsvp textarea::placeholder{color:rgba(255,244,230,.45)}
@media (prefers-reduced-motion:no-preference){
 .rv-on .rv{opacity:0;transform:translateY(34px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
 .rv-on .rv.in{opacity:1;transform:none}
 .rv-on .lp-head.rv .eyebrow::before{width:0;transition:width 1.1s .35s cubic-bezier(.2,.7,.2,1)}
 .rv-on .lp-head.rv.in .eyebrow::before{width:28px}
 .lp-hero .stg{animation:lpUp 1.1s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:var(--d,0s)}
 @keyframes lpUp{from{opacity:0;transform:translateY(30px)}}
 .lp-stage .phone.a{animation:lpPh 1.5s .25s cubic-bezier(.2,.7,.2,1) backwards}
 .lp-stage .phone.b{animation:lpPh 1.5s .5s cubic-bezier(.2,.7,.2,1) backwards}
 @keyframes lpPh{from{opacity:0;translate:0 70px}}
 .lp-chip.c1{animation:lpFl 6s ease-in-out infinite,lpUp 1s 1.2s backwards}
 .lp-chip.c2{animation:lpFl 7s -2s ease-in-out infinite,lpUp 1s 1.5s backwards}
 @keyframes lpFl{50%{transform:translateY(-12px)}}
 .lp-oval{animation:lpOv 9s ease-in-out infinite}
 @keyframes lpOv{50%{transform:translate(-50%,-50%) scale(1.035)}}
 .lp-stage .phone,.lp-chip{translate:calc(var(--px,0)*12px) calc(var(--py,0)*9px);transition:translate .5s cubic-bezier(.2,.7,.2,1)}
 .lp-stage .lp-chip{translate:calc(var(--px,0)*-18px) calc(var(--py,0)*-12px)}
 .inv .hero img,.inv .heroB img{animation:kb 26s ease-in-out infinite alternate}
 @keyframes kb{to{transform:scale(1.09)}}
 .inv .hero-t>*{animation:lpUp 1.2s cubic-bezier(.2,.7,.2,1) backwards}
 .inv .hero-t>*:nth-child(2){animation-delay:.15s}.inv .hero-t>*:nth-child(3){animation-delay:.3s}.inv .hero-t>*:nth-child(4){animation-delay:.45s}
 .lp-plan,.lp-tpl{will-change:transform}
}

/* ===== v6: Inviteri landing (chocolate · milk · sky) ===== */
.lp.lx{--bg:#f7f1ea;--surface:#fffaf4;--ink:#2b1a12;--muted:#7a6558;--line:#e8dccd;--accent:#3d2418;--accent-ink:#f7f1ea;--choc:#3d2418;--choc2:#5a3a2a;--milk:#efe3d3;--sky:#dfe9f1;--sky2:#b8cfe0;--gold:#b08d5a;--deep:#2a1a12;--deep-ink:#f4ece2;color:var(--ink);color-scheme:light;background:var(--bg);background-image:none;overflow-x:clip}
.lx .wrap{max-width:1240px;padding-inline:clamp(16px,4vw,40px)}
.lx h1,.lx h2,.lx h3{font-family:var(--f-display);font-weight:400;letter-spacing:-.015em}
.lx h2{font-size:clamp(36px,5.4vw,72px);line-height:1.02}
.lx h1 em,.lx h2 em{font-style:italic;color:var(--choc2);font-weight:400}
.lx .eyebrow{color:var(--muted);font:500 11.5px/1.2 var(--f-body);letter-spacing:.24em;text-transform:uppercase}
.lx .eyebrow::before{background:var(--choc);opacity:.6}
.lx .btn{border-radius:999px;font-weight:500;letter-spacing:.02em;transition:transform .35s cubic-bezier(.2,.7,.2,1),background .3s,color .3s,border-color .3s,box-shadow .3s}
.lx .btn:not(.ghost){background:var(--choc);border-color:var(--choc);color:var(--accent-ink);box-shadow:0 10px 24px rgba(61,36,24,.22)}
.lx .btn:hover{filter:none;transform:translateY(-2px)}
.lx .btn.ghost{border-color:color-mix(in srgb,var(--ink) 25%,transparent);color:var(--ink)}
.lx .btn.ghost:hover{border-color:var(--choc);background:var(--choc);color:var(--accent-ink)}
.lx .btn svg{width:18px;height:18px}
.lx .lnk{display:inline-flex;align-items:center;gap:8px;color:var(--choc);font-weight:500;font-size:15px;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}
.lx .lnk svg{width:16px;height:16px;transition:transform .3s}.lx .lnk:hover svg{transform:translateX(4px)}
.lx-head{display:grid;gap:18px;max-width:820px;margin-bottom:clamp(30px,5vw,56px)}
.lx-head p{color:var(--muted);font-size:17px;max-width:58ch}
.lx-head.c{text-align:center;margin-inline:auto;justify-items:center}
.lx-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}
.lx-rn{display:flex;gap:8px;flex:none}
.lx-rn button,.lx-fb{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:background .3s,color .3s,border-color .3s}
.lx-rn button svg,.lx-fb svg{width:20px;height:20px}
.lx-rn button:hover,.lx-fb:hover{background:var(--choc);color:var(--accent-ink);border-color:var(--choc)}
/* nav */
.lx .lp-nav{background:color-mix(in srgb,var(--bg) 84%,transparent);border-bottom:1px solid color-mix(in srgb,var(--line) 80%,transparent)}
.lx-logo{font:400 30px/1 var(--f-display);text-decoration:none;letter-spacing:.01em;display:inline-flex;align-items:baseline;gap:8px;color:var(--choc)}
.lx-logo small{font:500 10px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.lx .lp-nav nav a{font-size:14px;color:var(--ink);opacity:.72;position:relative}
.lx .lp-nav nav a:hover{opacity:1}
.lx .lp-nav nav a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--choc);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.lx .lp-nav nav a:hover::after{transform:scaleX(1)}
@media (max-width:620px){.lx-logo small{display:none}.lx .lp-nav .r .btn:not(.ghost){display:none}.lx .lp-nav .r .ghost{display:inline-flex}}
/* phone mockup: realistic iPhone */
.ph{--w:280px;width:var(--w);aspect-ratio:71.5/147;position:relative;flex:none;border-radius:calc(var(--w)*.165);padding:calc(var(--w)*.04);background:#0d0b0a;box-shadow:0 0 0 calc(var(--w)*.008) #6d655f,0 0 0 calc(var(--w)*.014) #2a2522,0 calc(var(--w)*.12) calc(var(--w)*.22) rgba(43,26,18,.22),0 calc(var(--w)*.03) calc(var(--w)*.06) rgba(43,26,18,.14);opacity:0;transition:opacity .7s ease}
.ph.ok{opacity:1}
.ph::before{content:"";position:absolute;z-index:4;top:calc(var(--w)*.068);left:50%;width:calc(var(--w)*.29);height:calc(var(--w)*.085);transform:translateX(-50%);border-radius:99px;background:#000}
.ph::after{content:"";position:absolute;z-index:3;inset:calc(var(--w)*.04);border-radius:calc(var(--w)*.13);pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.14),transparent 26%)}
.ph-b{position:absolute;left:calc(var(--w)*-.016);top:22%;width:calc(var(--w)*.012);height:9%;border-radius:2px;background:#4a433e;box-shadow:0 calc(var(--w)*.16) 0 #4a433e,calc(var(--w)*1.02) calc(var(--w)*.08) 0 #4a433e}
.ph-scr{position:relative;height:100%;border-radius:calc(var(--w)*.13);overflow:hidden;background:#efe8de}
.ph-scr>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0}
.ph.fit .ph-scr>img{object-position:50% 50%}
.ph-tr{display:flex;height:100%;transition:transform .9s cubic-bezier(.65,.05,.25,1)}
.ph-tr img{flex:0 0 100%;width:100%;height:100%;object-fit:cover}
.ph-dots{position:absolute;z-index:5;left:50%;top:calc(100% + 14px);transform:translateX(-50%);display:none;gap:5px}
.ph-dots i{width:6px;height:6px;border-radius:99px;background:color-mix(in srgb,var(--choc) 25%,transparent);transition:width .4s,background .4s}
.ph-dots i.on{width:20px;background:var(--choc)}
.ph iframe{position:absolute;left:0;top:0;width:390px;border:0;background:#fff;transform-origin:0 0}
/* hero */
.lx-hero{position:relative;padding-block:clamp(24px,4vw,56px) clamp(30px,4vw,60px);overflow:hidden;background:radial-gradient(900px 600px at 78% 60%,var(--sky),transparent 65%)}
.lx-hg{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(20px,4vw,60px);align-items:center;min-height:min(760px,calc(100vh - 80px))}
.lx-hc{position:relative;z-index:3}
.lx-live{display:inline-flex;align-items:center;gap:10px;padding:8px 16px 8px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font:500 13px/1 var(--f-body);color:var(--ink)}
.lx-live i{width:8px;height:8px;border-radius:50%;background:var(--choc);animation:lxpulseC 2s infinite}
@keyframes lxpulseC{0%{box-shadow:0 0 0 0 rgba(61,36,24,.45)}70%{box-shadow:0 0 0 9px rgba(61,36,24,0)}100%{box-shadow:0 0 0 0 rgba(61,36,24,0)}}
.lx-hero h1{font-size:clamp(42px,5.6vw,92px);line-height:.98;margin-top:22px;max-width:12ch;letter-spacing:-.02em;color:var(--choc)}
.lx-hero h1 .w{display:inline-block}
.lx-hero h1 em{font-style:italic;color:var(--choc2);position:relative;isolation:isolate;white-space:nowrap}
.lx-hero h1 em::after{content:"";position:absolute;left:-2%;right:-2%;bottom:.06em;height:.24em;background:var(--sky2);opacity:.75;z-index:-1;border-radius:4px;transform-origin:left;animation:lxmark 1s 1.2s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes lxmark{from{transform:scaleX(0)}}
.lx-hero .lead{font-size:clamp(16px,1.35vw,19px);max-width:46ch;margin-top:22px;color:var(--muted)}
.lx-hero .cta{margin-top:28px}
.lx-price{margin-top:16px;font-size:13.5px;color:var(--muted)}
.lx-price a{color:var(--choc);font-weight:500}
.lx-stage{position:relative;height:clamp(520px,48vw,680px)}
.lx-halo{position:absolute;left:50%;top:50%;width:78%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(255,255,255,0));animation:lxhalo 8s ease-in-out infinite}
@keyframes lxhalo{50%{transform:translate(-50%,-50%) scale(1.08)}}
.lx-stage .ph{position:absolute;top:50%;left:50%}

 .lx-stage .ph.front.ok{animation:lxRiseF 1.4s .3s cubic-bezier(.2,.7,.2,1) backwards}

 .lx-stage .ph.front{translate:calc(var(--px,0)*14px) calc(var(--py,0)*10px + var(--sy,0)*-30px)}

 .lx-chip.c1{animation:lpFl 6s ease-in-out infinite,lpUp 1s 1.1s backwards}

 .lx-chip.c3{animation:lpFl 8s -4s ease-in-out infinite,lpUp 1s 1.5s backwards}
 .rv-on .lx-card.rv{opacity:0;transform:translateY(50px) scale(.97)}
 .rv-on .lx-card.rv.in{opacity:1;transform:none;transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
 .lx .btn:not(.ghost){position:relative;overflow:hidden}
 .lx .btn:not(.ghost)::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);transition:left .7s}
 .lx .btn:not(.ghost):hover::after{left:130%}
}

function parts(iso){var a=String(iso||'').split('-').map(Number);return {y:a[0]||2027,m:a[1]||1,d:a[2]||1}}
function addDay(iso,n){var p=parts(iso);var dt=new Date(Date.UTC(p.y,p.m-1,p.d+n));return dt.getUTCFullYear()+'-'+String(dt.getUTCMonth()+1).padStart(2,'0')+'-'+String(dt.getUTCDate()).padStart(2,'0')}
function fmt(iso,L,o){var p=parts(iso);try{return new Intl.DateTimeFormat(langOf(L).locale,Object.assign({timeZone:'UTC'},o)).format(new Date(Date.UTC(p.y,p.m-1,p.d)))}catch(e){return iso}}
function numDate(iso){var p=parts(iso);return String(p.d).padStart(2,'0')+' / '+String(p.m).padStart(2,'0')+' / '+p.y}
function calHTML(iso,span,L){
  var p=parts(iso);
  var first=(new Date(Date.UTC(p.y,p.m-1,1)).getUTCDay()+6)%7;
  var n=new Date(Date.UTC(p.y,p.m,0)).getUTCDate();
  var c='';for(var i=0;i<first;i++)c+='<i></i>';
  for(var k=1;k<=n;k++){if(k>=p.d&&k<p.d+span)c+='<b class="on heart">♥</b>';else c+='<b>'+k+'</b>'}
  return '<div class="cal-m">'+esc(fmt(iso,L,{month:'long'}))+'</div><div class="cal-g">'+c+'</div>';
}
function tick(){
  var els=document.querySelectorAll('.cd');
  for(var i=0;i<els.length;i++){
    var el=els[i],p=parts(el.getAttribute('data-date'));
    var ms=Math.max(0,new Date(p.y,p.m-1,p.d,0,0,0).getTime()-Date.now());
    var v=[Math.floor(ms/864e5),Math.floor(ms/36e5)%24,Math.floor(ms/6e4)%60,Math.floor(ms/1e3)%60];
    var bs=el.querySelectorAll('b');
    for(var j=0;j<4&&j<bs.length;j++)bs[j].textContent=String(v[j]).padStart(2,'0');
  }
}

var scrollCancel=0;
function palGo(sel,dur,off){
  if(!document.querySelector('.demo-col'))return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var t=document.querySelector(sel);if(!t)return;
  var y0=window.scrollY,y1=Math.max(0,t.getBoundingClientRect().top+y0+(off||0));
  if(Math.abs(y1-y0)<30)return;
  var id=++scrollCancel,t0=null,ev=['wheel','touchstart','keydown','mousedown'];
  function stop(){scrollCancel++;ev.forEach(function(n){window.removeEventListener(n,stop)})}
  ev.forEach(function(n){window.addEventListener(n,stop,{passive:true})});
  function ease(p){return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2}
  function step(ts){
    if(id!==scrollCancel)return;if(t0==null)t0=ts;
    var p=Math.min(1,(ts-t0)/dur);window.scrollTo(0,y0+(y1-y0)*ease(p));
    if(p<1)requestAnimationFrame(step);else stop();
  }
  requestAnimationFrame(step);
}
var coinImg=null;
function palUnlock(sec){
  if(palOn)return;palOn=true;
  var after=app.querySelector('.pl-after');
  sec.classList.add('on');var c=sec.querySelector('.pl-circs');if(c)c.classList.add('on');
  var im=document.createElement('img');im.className='pl-conf';im.alt='';im.src=PAL+'confetti.webp';sec.insertBefore(im,sec.firstChild);
  setTimeout(function(){if(after)after.classList.remove('pl-lock');reveal();setTimeout(function(){palGo('.pl-loc',2600,-50)},1500)},1300);

function palInit(){
  var sec=app.querySelector('.pl-rev');if(!sec||palOn)return;
  var cs=sec.querySelectorAll('.pl-circs .c:not([data-i])');if(!cs.length)return;
  if(!coinImg){coinImg=new Image();coinImg.src=PAL+'coin.webp'}
  var done=0,total=sec.querySelectorAll('.pl-circs .c').length;
  cs.forEach(function(c){
    c.setAttribute('data-i','1');
    var cv=document.createElement('canvas'),dpr=Math.min(2,window.devicePixelRatio||1),w=Math.round(c.clientWidth*dpr)||300;
    cv.width=cv.height=w;cv.className='sc';c.appendChild(cv);
    var x=cv.getContext('2d',{willReadFrequently:true}),fin=false,last=null,ink=1,tmr=0;
    function paint(){x.globalCompositeOperation='source-over';x.drawImage(coinImg,0,0,w,w);ink=countInk()||1}
    function countInk(){var d=x.getImageData(0,0,w,w).data,n=0;for(var i=3;i<d.length;i+=16)if(d[i]>30)n++;return n}
    if(coinImg.complete)paint();else coinImg.addEventListener('load',paint,{once:true});
    function pos(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)*w/r.width,(e.clientY-r.top)*w/r.height]}
    function scratch(p){
      x.globalCompositeOperation='destination-out';x.lineCap=x.lineJoin='round';x.lineWidth=w*.2;
      x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(p[0]+.01,p[1]);x.stroke();last=p;
      if(!tmr)tmr=setTimeout(function(){tmr=0;if(countInk()/ink<.38)return;finish()},120);
    }
    function finish(){if(fin)return;fin=true;c.classList.add('done');done++;if(done>=total)palUnlock(sec)}
    cv.addEventListener('pointerdown',function(e){if(fin)return;cv.setPointerCapture(e.pointerId);last=pos(e);scratch(last)});
    cv.addEventListener('pointermove',function(e){if(fin||!last)return;scratch(pos(e))});
    cv.addEventListener('pointerup',function(){last=null});cv.addEventListener('pointercancel',function(){last=null});
    c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();finish()}});
    c.addEventListener('dblclick',finish);
  });
}

function slInit(root){
  var calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  (root||document).querySelectorAll('[data-phs]').forEach(function(ph,k){
    if(ph._sl)return;ph._sl=1;
    var tr=ph.querySelector('.ph-tr'),n=tr.children.length,dots=[].slice.call(ph.querySelectorAll('.ph-dots i')),i=0,vis=false;
    function go(j){i=(j+n)%n;tr.style.transform='translateX('+(-100*i)+'%)';dots.forEach(function(d,x){d.classList.toggle('on',x===i)})}
    ph._go=go;
    if(calm||n<2)return;
    if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){vis=es[0].isIntersecting},{threshold:.4});io.observe(ph)}else vis=true;
    var hov=false;ph.addEventListener('mouseenter',function(){hov=true});ph.addEventListener('mouseleave',function(){hov=false});
    setTimeout(function(){var t=setInterval(function(){if(!document.body.contains(ph)){clearInterval(t);return}if(vis&&!hov)go(i+1)},2800);slTimers.push(t)},k*450);
  });
}
